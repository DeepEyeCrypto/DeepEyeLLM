[package]
name = "shared"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "deepeye_core"

[dependencies]
uniffi = "0.28.0"
cozodb = "0.7.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["rt", "macros"] }

[build-dependencies]
uniffi = { version = "0.28.0", features = ["build"] }
